name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'macros/**'

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Check the projected macro crate
        run: cargo +1.95.0 check --manifest-path macros/Cargo.toml
